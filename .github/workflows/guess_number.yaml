name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: guess_number-${{ github.ref_name }}-linux-x86_64
            archive: guess_number-${{ github.ref_name }}-linux-x86_64.tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: guess_number-${{ github.ref_name }}-windows-x86_64
            archive: guess_number-${{ github.ref_name }}-windows-x86_64.zip

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: guess_number-${{ github.ref_name }}-macos-x86_64
            archive: guess_number-${{ github.ref_name }}-macos-x86_64.tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: guess_number-${{ github.ref_name }}-macos-arm64
            archive: guess_number-${{ github.ref_name }}-macos-arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} --verbose

      # ---------- 打包（Linux / macOS 用 tar.gz） ----------
      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/guess_number dist/
          cd dist
          tar -czvf ../${{ matrix.archive }} *
          cd ..
          ls -lh ${{ matrix.archive }}

      # ---------- 打包（Windows 用 zip） ----------
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\${{ matrix.target }}\release\guess_number.exe dist\
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.archive }}
          Get-Item ${{ matrix.archive }} | Format-List

      # ---------- 上传到同一个 Release ----------
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}